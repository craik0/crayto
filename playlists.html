<!DOCTYPE html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>craiko.net - Works</title>
    <!-- Critical resource preloads -->
    <link rel="preload" href="styles.css" as="style">
    <link rel="preload" href="script.js" as="script">
    
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="//www.youtube.com">
    <link rel="dns-prefetch" href="//x.com">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="craiko.png">
    <meta property="og:image" content="craiko.png">

    <style>
        .works-row {
            display: grid;
            grid-template-columns: repeat(3, 250px);
            justify-content: center;
            gap: 20px;
            padding: 20px 0;
        }

        .work-item {
            flex: 0 0 auto;
            text-align: center;
            width: 250px;
        }

        .image-wrapper {
            width: 250px;
            height: 250px;
            border-radius: 10px;
            overflow: hidden;
        }

        .work-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
            display: block;
        }

        .work-item p {
            margin-top: 10px;
            font-weight: bold;
            text-decoration: none;
        }

        .works-row::-webkit-scrollbar {
            display: none;
        }



        /* -- Mobile: stack in one column -- */
        @media (max-width: 768px) {
            .works-row {
                /* one column grid */
                grid-template-columns: 1fr;
            }
            .work-item {
                /* let items size naturally within column */
                width: 100%;
                max-width: 250px;
                margin: 0 auto 20px;
            }
        }
    </style>
</head>
