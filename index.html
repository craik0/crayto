  <style>
    /* Page-specific: Blue glass button with white text */
    .happy-link a {
      font-family: sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #fff; /* white text */
      text-decoration: none;
      padding: 12px 20px;
      border: 1px solid rgba(0,191,255,0.35); /* blue-tinted border */
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(0,191,255,0.35), rgba(0,191,255,0.20)); /* blue glass gradient */
      background-color: rgba(0,191,255,0.18); /* blue glass fallback */
      box-shadow: 0 6px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.25);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      cursor: pointer;
      position: relative;
      display: inline-block;
      transition: transform 0.2s cubic-bezier(.2,.8,.2,1),
                  box-shadow 0.2s cubic-bezier(.2,.8,.2,1),
                  background-color 0.2s cubic-bezier(.2,.8,.2,1),
                  color 0.2s cubic-bezier(.2,.8,.2,1);
    }
    .happy-link a::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0) 42%);
      pointer-events: none;
      mix-blend-mode: screen;
    }
    .happy-link a:hover {
      background-color: var(--accent);
      color: #fff; /* keep white text on hover */
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(0,0,0,0.16), 0 0 0 2px rgba(0,191,255,0.15);
    }
    .happy-link a:active {
      transform: translateY(0);
      opacity: 0.95;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    }
    .happy-link a:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(0,191,255,0.35), 0 6px 24px rgba(0,0,0,0.12);
    }
  </style>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "craiko.net",
    "url": "https://craiko.net/",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://craiko.net/blog.html?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
