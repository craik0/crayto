<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>craiko.net - Deltarune</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      background: black;
      color: #00BFFF;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      overflow-x: hidden;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 50;
    }

    nav ul {
      list-style: none;
      padding: 10px 0;
      margin: 8px auto;
      display: flex;
      justify-content: center;
      background: linear-gradient(180deg, rgba(0,191,255,0.22), rgba(0,191,255,0.10));
      background-color: rgba(0,0,0,0.35);
      border: 1px solid rgba(0,191,255,0.35);
      border-radius: 12px;
      backdrop-filter: blur(10px) saturate(150%);
      -webkit-backdrop-filter: blur(10px) saturate(150%);
      box-shadow: 0 8px 28px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.18);
      width: min(980px, calc(100% - 16px));
    }

    nav ul li {
      margin: 0 15px;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-size: 0.7rem;
      padding: 10px;
      display: inline-block;
      transition: background-color 0.2s cubic-bezier(.2,.8,.2,1), color 0.2s cubic-bezier(.2,.8,.2,1), transform 0.2s cubic-bezier(.2,.8,.2,1);
      cursor: pointer;
      position: relative;
      border-radius: 8px;
    }

    nav ul li a:hover {
      background-color: rgba(0,191,255,0.25);
      color: #fff;
      transform: translateY(-1px);
    }

    #date-time {
      margin: 20px 0;
      font-size: 0.7rem;
      color: var(--accent);
      text-shadow: var(--glow);
    }

    .work-page p {
      max-width: 800px;
      margin: 100px auto 40px;
      font-size: 0.7rem;
      line-height: 1.6;
      text-shadow: 0 0 6px rgba(0, 191, 255, 0.8);
    }

    .youtube-link iframe {
      width: 90%;
      height: 400px;
      border: none;
      box-shadow: var(--shadow);
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .buttons {
      margin: 40px auto;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .buttons .btn {
      font-family: sans-serif;
      font-size: 1rem;
      font-weight: 700;
      color: #fff; /* white text */
      text-decoration: none;
      padding: 12px 20px;
      border: 1px solid rgba(0,191,255,0.35); /* blue-tinted border */
      border-radius: 10px;
      background: linear-gradient(180deg, rgba(0,191,255,0.35), rgba(0,191,255,0.20)); /* blue glass gradient */
      background-color: rgba(0,191,255,0.18); /* blue glass fallback */
      box-shadow: 0 6px 24px rgba(0,0,0,0.12), inset 0 1px 0 rgba(255,255,255,0.25);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
      cursor: pointer;
      position: relative;
      transition: transform 0.2s cubic-bezier(.2,.8,.2,1),
                  box-shadow 0.2s cubic-bezier(.2,.8,.2,1),
                  background-color 0.2s cubic-bezier(.2,.8,.2,1),
                  color 0.2s cubic-bezier(.2,.8,.2,1);
    }
    .buttons .btn::after {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(180deg, rgba(255,255,255,0.6), rgba(255,255,255,0) 42%);
      pointer-events: none;
      mix-blend-mode: screen;
    }

    .buttons .btn:hover {
      background-color: var(--accent);
      color: #fff; /* keep white text on hover */
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 8px 30px rgba(0,0,0,0.16), 0 0 0 2px rgba(0,191,255,0.15);
    }
    .buttons .btn:active {
      transform: translateY(0);
      opacity: 0.95;
      box-shadow: 0 4px 16px rgba(0,0,0,0.14);
    }
    .buttons .btn:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(0,191,255,0.35), 0 6px 24px rgba(0,0,0,0.12);
    }

    @media (max-width: 600px) {
      .work-page p {
        padding: 0 20px;
        font-size: 0.6rem;
      }

      .youtube-link iframe {
        height: 240px;
      }

      .buttons .btn {
        font-size: 0.8rem;
        padding: 10px 16px;
      }
    }
  </style>

  {
    "@context": "https://schema.org",

    "thumbnailUrl": ["craiko.png"],
    "embedUrl": "https://www.youtube.com/embed/duns8AY4JEg",

    "publisher": { "@type": "Organization", "name": "Craiko" },
    "isFamilyFriendly": true
  }
  </script>
</head>

 <p style="
