<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>craiko.net - Deltarune</title>
  <link rel="stylesheet" href="styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />

  <style>
    body {
      margin: 0;
      background: black;
      color: #00BFFF;
      font-family: 'Press Start 2P', monospace;
      text-align: center;
      overflow-x: hidden;
    }

    nav ul {
      list-style: none;
      padding: 10px 0;
      margin: 0;
      display: flex;
      justify-content: center;
      background-color: rgba(0, 0, 0, 0.5);
    }

    nav ul li {
      margin: 0 15px;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-size: 0.7rem;
      padding: 10px;
      display: inline-block;
      transition: background 0.3s;
    }

    nav ul li a:hover {
      background-color: rgba(255, 255, 255, 0.15);
    }

    #date-time {
      margin: 20px 0;
      font-size: 0.7rem;
      color: white;
      text-shadow: 0 0 4px cyan;
    }

    .work-page p {
      max-width: 800px;
      margin: 100px auto 40px;
      font-size: 0.7rem;
      line-height: 1.6;
      text-shadow: 0 0 6px rgba(0, 191, 255, 0.8);
    }

    .youtube-link iframe {
      width: 90%;
      height: 400px;
      border: none;
      box-shadow: 0 0 10px #00BFFF;
    }

    .buttons {
      margin: 40px auto;
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .buttons .btn {
      font-family: sans-serif;
      font-size: 1rem;
      font-weight: bold;
      color: #FFA500;
      text-decoration: none;
      padding: 12px 20px;
      border: 2px solid #FFA500;
      border-radius: 5px;
      transition: all 0.3s ease-in-out;
      background: transparent;
    }

    .buttons .btn:hover {
      background-color: #FFA500;
      color: black;
      transform: translateY(-2px);
    }

    @media (max-width: 600px) {
      .work-page p {
        padding: 0 20px;
        font-size: 0.6rem;
      }

      .youtube-link iframe {
        height: 240px;
      }

      .buttons .btn {
        font-size: 0.8rem;
        padding: 10px 16px;
      }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="playlists.html">WORKS</a></li>
      <li><a href="blog.html">BLOG</a></li>
      <li><a href="about.html">ABOUT</a></li>
    </ul>
  </nav>

  <div id="date-time">Loading time...</div>

  <main class="container">
    <section class="work-page">
 <p style="
  font-family: 'Press Start 2P', monospace;
  font-size: 0.7rem;
  line-height: 1.6;
  color: #00BFFF;
  text-shadow: 0 0 6px rgba(0, 191, 255, 0.8);
  max-width: 800px;
  margin: 100px auto;
">
  This is my let's play of Deltarune by Toby Fox.<br />
  I will be updating when I feel like it. Join me for the adventures of Kris, Susie, and Ralsei as they try to save the world from an otherworldly threat.
</p>

      <div class="youtube-link">
        <iframe width="560" height="315" src="https://www.youtube.com/embed/duns8AY4JEg?si=J_tJTul1PQi92k-B" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>

      <div class="buttons">
        <a href="select.html" class="btn">SELECT</a>
        <a href="playlists.html" class="btn">BACK</a>
      </div>
    </section>
  </main>

  <script>
    document.getElementById("date-time").textContent = new Date().toLocaleString();
  </script>
</body>
</html>
