<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play TIME</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    @media (min-width: 769px) {
      /* Desktop: show game, back button at bottom */
      .mobile-warning { display: none !important; }
    }
    @media (max-width: 768px) {
      /* Mobile: only show warning + back button */
      .back-container { display: block; }
    }
    body.mobile-only {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      text-align: center;
    }
    .mobile-warning {
      font-size: 1.2rem;
      margin-bottom: 20px;
    }
    .back-container {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li><a href="index.html">HOME</a></li>
      <li><a href="playlists.html">WORKS</a></li>
      <li><a href="blog.html">BLOG</a></li>
      <li><a href="about.html">ABOUT</a></li>
    </ul>
  </nav>
  
  <div id="date-time"></div>
  
  <div class="wrap">
    <canvas id="game" width="480" height="270"></canvas>
    <div class="hud">
      <div class="left">
        <strong>Controls:</strong>
        <span>
          <kbd>A</kbd>/<kbd>←</kbd> left • 
          <kbd>D</kbd>/<kbd>→</kbd> right • 
          <kbd>Space</kbd>/<kbd>W</kbd>/<kbd>↑</kbd> jump (double jump)
        </span>
        <span id="levelLabel" class="pill" style="padding:4px 8px; opacity:.9;">Level 1</span>
      </div>
      <div class="right">
        <button id="prevLevel" title="Previous level">◀</button>
        <button id="nextLevel" title="Next level">▶</button>
        <button id="musicBtn" title="Toggle music">Music</button>
        <button id="reset">Reset</button>
      </div>
    </div>
</div>
  <div class="mobile-warning" style="text-align:center; margin:20px; display:none; font-weight:bold; color:red;">
    DREAD IS MADE FOR PC.
  </div>
  <script>
    (function(){
      var isMobile = /Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
      if (isMobile) {
        var wrap = document.querySelector('.wrap');
        var warning = document.querySelector('.mobile-warning');
        var back = document.querySelector('.back-container');
        if (wrap) wrap.style.display = 'none';
        if (warning) warning.style.display = 'block';
        if (back) back.style.display = 'block';
        document.body.classList.add('mobile-only');
      }
    })();
  </script>
  <div class="back-container" style="display:block; text-align:center;">
    <a href="playlists.html" class="button-link glass-btn--blue">BACK</a>
  </div>
  <script type="module" src="time/main.js"></script>
  <script src="script.js"></script>
</body>
</html>
