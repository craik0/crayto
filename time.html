<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play TIME</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <nav class="glass nav">
    <a href="/" class="nav-logo"><img src="imgs/logo.png" alt="Craiko Logo"></a>
    <div class="nav-links">
      <a href="/">Home</a>
      <a href="/works.html">Works</a>
      <a href="/blog.html">Blog</a>
      <a href="/about.html">About</a>
    </div>
  </nav>
  <div class="wrap">
    <canvas id="game" width="480" height="270"></canvas>
    <div class="hud">
      <div class="left">
        <strong>Controls:</strong>
        <span>
          <kbd>A</kbd>/<kbd>←</kbd> left • 
          <kbd>D</kbd>/<kbd>→</kbd> right • 
          <kbd>Space</kbd>/<kbd>W</kbd>/<kbd>↑</kbd> jump (double jump)
        </span>
        <span id="levelLabel" class="pill" style="padding:4px 8px; opacity:.9;">Level 1</span>
      </div>
      <div class="right">
        <button id="prevLevel" title="Previous level">◀</button>
        <button id="nextLevel" title="Next level">▶</button>
        <button id="musicBtn" title="Toggle music">Music</button>
        <button id="reset">Reset</button>
      </div>
    </div>
  </div>
  <script type="module" src="time/main.js"></script>
</body>
</html>
