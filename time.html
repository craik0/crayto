

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Play TIME</title>
  <link rel="stylesheet" href="time/style.css">
</head>
<body>
  <nav class="navbar glassy">
    <a href="index.html" class="logo">Craiko</a>
    <ul class="nav-links">
      <li><a href="/videos.html">Videos</a></li>
      <li><a href="/blog.html">Blog</a></li>
      <li><a href="/works.html">Works</a></li>
    </ul>
  </nav>
  <div style="margin-top:100px;">
    <div class="wrap">
    <canvas id="game" width="960" height="540"></canvas>
    <div class="hud">
      <div class="left">
        <strong>Controls:</strong>
        <span>
          <kbd>A</kbd>/<kbd>←</kbd> left • 
          <kbd>D</kbd>/<kbd>→</kbd> right • 
          <kbd>Space</kbd>/<kbd>W</kbd>/<kbd>↑</kbd> jump (double jump)
        </span>
        <span id="levelLabel" class="pill" style="padding:4px 8px; opacity:.9;">Level 1</span>
      </div>
      <div class="right">
        <button id="prevLevel" title="Previous level">◀</button>
        <button id="nextLevel" title="Next level">▶</button>
        <button id="musicBtn" title="Toggle music">Music</button>
        <button id="reset">Reset</button>
      </div>
    </div>
    </div>
  </div>
  <script type="module" src="time/main.js"></script>
</body>
</html>
